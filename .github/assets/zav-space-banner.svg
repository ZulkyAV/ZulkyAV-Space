<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title description">
  <title id="title">ZulkyAV Space</title>
  <desc id="description">A dark purple banner for the ZulkyAV personal lab.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.52" stop-color="#0b0712"/>
      <stop offset="1" stop-color="#120824"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d8b4fe"/>
      <stop offset="0.68" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.58"/>
      <stop offset="0.48" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#a78bfa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="500" rx="36" fill="url(#background)"/>
  <rect width="1400" height="500" rx="36" fill="url(#grid)"/>
  <circle cx="1160" cy="100" r="310" fill="url(#orb)"/>
  <circle cx="150" cy="470" r="250" fill="url(#orb)" opacity="0.45"/>

  <rect x="58" y="52" width="1284" height="396" rx="34" fill="#0b0910" fill-opacity="0.76" stroke="#a78bfa" stroke-opacity="0.18"/>
  <path d="M91 408 H1309" stroke="url(#violet)" stroke-opacity="0.22"/>

  <g transform="translate(112 118)">
    <rect width="180" height="180" rx="42" fill="#050507" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="13" y="13" width="154" height="154" rx="34" fill="none" stroke="#7c3aed" stroke-opacity="0.25"/>
    <text x="90" y="111" text-anchor="middle" fill="url(#violet)" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="-6" filter="url(#glow)">ZAV</text>
    <circle cx="144" cy="37" r="5" fill="#c4b5fd"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="348" y="142" fill="#a78bfa" font-size="18" font-weight="700" letter-spacing="5">ZULKYAV / PERSONAL LAB</text>
    <text x="344" y="224" fill="#f8fafc" font-size="62" font-weight="800" letter-spacing="-2">ZulkyAV Space</text>
    <text x="348" y="272" fill="#b7b3c5" font-size="22">Notes, projects, experiments, and small ventures.</text>
    <text x="348" y="315" fill="#d8b4fe" font-size="17" font-weight="600" letter-spacing="2">BUILT SLOWLY. SHIPPED FOR REAL.</text>

    <g transform="translate(348 352)">
      <rect width="112" height="38" rx="19" fill="#8b5cf6" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.28"/>
      <text x="56" y="25" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="700">NEXT.JS</text>

      <rect x="126" width="118" height="38" rx="19" fill="#8b5cf6" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.28"/>
      <text x="185" y="25" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="700">SUPABASE</text>

      <rect x="258" width="125" height="38" rx="19" fill="#8b5cf6" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.28"/>
      <text x="320.5" y="25" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="700">CLOUDINARY</text>

      <rect x="397" width="92" height="38" rx="19" fill="#8b5cf6" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.28"/>
      <text x="443" y="25" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="700">PWA</text>
    </g>
  </g>

  <g opacity="0.65">
    <circle cx="1252" cy="371" r="6" fill="#c4b5fd"/>
    <circle cx="1281" cy="371" r="6" fill="#8b5cf6"/>
    <circle cx="1310" cy="371" r="6" fill="#5b21b6"/>
  </g>
</svg>
